<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <a href="index.html" class="logo" title="voltar para página inicial">
        <img
          class="img-mobile"
          src="img/bussola-jornada-branca.png"
          alt="Bussola do logo Jornada Viagens na cor branca"
        />
        <img
          class="img-desktop"
          src="img/bussola-texto-jornada-branca.png"
          alt="Loogo Jornada Viagens na cor branca"
        />
      </a>
      <div>
        <label for="menu">
          <img src="img/menu.png" alt="menu" />
        </label>
        <input type="checkbox" id="menu" hidden />
        <nav>
          <ul class="list-links">
            <li>
              <a href="blog.html" target="_blank" title="Acessar Blog">Blog</a>
            </li>
            <li>
              <a
                href="pacotes.html"
                target="_blank"
                title="Acessar Pacotes de viagens"
                >Pacote de viagens</a
              >
            </li>
            <li>
              <a href="contato.html" target="_blank" title="Acessar Contato"
                >Contato</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <section class="hero">
      <div class="hero-img"></div>
      <h2>
        Somos uma agência apaixonada por criar viagens inesquecíveis. Do destino
        à seleção das atividades, cuidamos de todos os detalhes para que você
        aproveite ao máximo cada momento da sua jornada!
      </h2>
    </section>
    <section class="offers">
      <div class="section-title">
        <h2>Ofertas da Semana</h2>
        <hr>
      </div>
      <div class="offers-cards">
        <article class="card">
          <header>
            <p>HOTEL+AÉREO</p>
            <h3>Japão </h3>
            <span>R$ 4000</span>
          </header>
          <footer>
            <a href="#" class="button">Ver detalhes</a>
          </footer>
        </article>
      </div>
    </section>
  </body>
</html>
